# Testowy Keycloak — osobny projekt compose `wd-keycloak` (kontrakt WP E0-3 C11; 11-infrastruktura.md §3.4).
# Bez bind-mountów: realm jest wypalony w obrazie. Port hosta: KC_PORT (dom. 8180).

name: wd-keycloak

services:
  keycloak:
    image: wawelsky/keycloak-test:26.7.4
    build: .
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: dev-mem
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:${KC_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: 8080
    ports:
      - "${KC_PORT:-8180}:8080"
    healthcheck:
      # Obraz Keycloaka nie ma curl/wget — bashowy /dev/tcp na porcie zarządzania 9000.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && grep -q '"status": *"UP"' <&3
      interval: 5s
      retries: 60
      start_period: 10s
    networks:
      - wd-sso

networks:
  wd-sso:
    name: wd-sso
