# Odchyłki złota v0.27.2 dla scenariusza chunks_extras (K11 §5 p. 5; K11 §10b).
# Dwie grupy:
#  * [chunker] — różnice chunkera WD (K5 §5) dla chunka z parsowania dokumentu (naive): brak
#    wiodącego "\n" sekcji i brak fabrykowanej pozycji [[1, 0, 0, 0, 0]]. Wpis wypisany w raporcie
#    zadania CH-chunks-extras (brief wym. 1); ten sam mechanizm co odchyłki chunks_list.yaml.
#  * [es-refresh] — złoto utrwala nieświeży odczyt ES: upstream PATCH …/chunks/{id} i zbiorczy
#    PATCH …/chunks piszą przez `settings.docStoreConn.update`, które dla warunku z `id` woła
#    `self.es.update(index=…, id=…, doc=…)` bez `refresh` (rag/utils/es_conn.py, v0.27.2; `insert`
#    ma `refresh="wait_for"`), a odczyt listy/search idzie przez `retriever.search` (okno
#    `refresh_interval` = 1000 ms, conf/mapping.json). Dlatego --11/--13/--15/--16/--17 pokazują
#    stan chunka ręcznego dokładnie taki jak --07 (po POST), mimo późniejszych zapisów.
#    DEC-034 (Doradca, 2026-09-29): WD zwraca stan po zapisie (read-your-writes) i nie odtwarza
#    nieświeżości; wpisy do zatwierdzenia TL/Architekta. Żądania i odpowiedzi kroków mutujących
#    (`--09` PATCH → code 0, `--12`/`--14` switch → code 0) potwierdzają w złocie, że zapis nastąpił.

