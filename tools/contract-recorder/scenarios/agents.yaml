# Agent app (RAGFlow v0.27.2, api/apps/restful_apis/agent_api.py):
#   GET    /agents                          l. 680  (lista; keywords/canvas_category/canvas_type/owner_ids/tags/page/page_size/orderby/desc/type=filter)
#   POST   /agents                          l. 923  (wymaga dsl + title; duplicate -> 102)
#   GET    /agents/templates                l. 647  (wszystkie szablony z bazy; brak parametrow zawezajacych — plik ~0.5 MB)
#   GET    /agents/<agent_id>               l. 1073
#   PUT    /agents/<agent_id>               l. 1173 (waliduje dsl przez Canvas.validate_component_parameters)
#   DELETE /agents/<agent_id>               l. 1164 (tylko wlasciciel)
#   GET    /agents/<agent_id>/sessions      l. 430  (id/user_id/page/page_size/keywords/orderby/desc/exp_user_id/dsl)
#   POST   /agents/<agent_id>/sessions      l. 470
#   GET    /agents/<agent_id>/sessions/<sid>  l. 510
#   DELETE /agents/<agent_id>/sessions/<sid>  l. 521
#   DELETE /agents/<agent_id>/sessions      l. 532  (body {ids: [...]} albo {delete_all: true})
#   POST   /agents/chat/completions         l. 1444 (agent_id w ciele; query/question; session_id; stream; openai-compatible; return_trace)
# Trasy poza zakresem T2 (nie nagrywane, patrz reports/T2-routes.md):
#   /agents/prompts, /agents/download, /agents/tags (GET/PUT), /agents/<id>/upload,
#   /agents/<id>/components/<cid>/{input-form,debug}, /agents/<id>/versions[...],
#   /agents/<id>/logs/<mid>, /agents/<id>/reset, /agents/rerun, /agents/test_db_connection,
#   /agents/<id>/webhook[...], /agents/attachments/<id>/{preview,download}.
# DSL: uproszczenie szablonu agent/templates/your_starter_dataset_chatbot.json do grafu
# Begin -> Agent -> Message (patrz work/wp/E6-0/reports/T2-notes.md). Parametry komponentu Agent
# skopiowane z tego szablonu, `llm_id` = model czatu datasetu (session.chat_model), `tools` puste
# (wariant liniowy) albo z narzędziem Retrieval (wariant retrieval; dataset z kroku 1).
# Wszystkie kroki tylko v0.27.2 (E6 nie ma shimu v0.24.0).
name: agents
description: "Agent app: CRUD /agents, sesje, /agents/templates i /agents/chat/completions (SSE i JSON, wariant Retrieval)."
steps:
  # --- przygotowanie (bez nagrania): dataset + upload + parse + poll DONE ---
  - id: create_dataset
    method: POST
    path: /api/v1/datasets
    json: {name: "wd_rec_e6_agents_ds"}
    auth: key
    versions: [v0.27.2]
    record: false
    capture: {dataset_id: "data.id", chat_model: "data.parser_config.llm_id"}
  - id: upload
    method: POST
    path: /api/v1/datasets/{dataset_id}/documents
    multipart: {file: fixtures/ragflow_intro.txt}
    auth: key
    versions: [v0.27.2]
    record: false
    capture: {document_id: "data.0.id"}
  - id: parse
    method: POST
    path: /api/v1/datasets/{dataset_id}/documents/parse
    json: {document_ids: ["{document_id}"]}
    auth: key
    versions: [v0.27.2]
    record: false
  - id: poll_parse_done
    method: GET
    path: /api/v1/datasets/{dataset_id}/documents
    query: {page: 1, page_size: 30}
    auth: key
    versions: [v0.27.2]
    record: false
    poll:
      until: {path: "data.docs.0.run", equals: "DONE"}
      interval_s: 3
      timeout_s: 600

  # --- szablony agentow ---
  - id: list_templates
    method: GET
    path: /api/v1/agents/templates
    auth: key
    versions: [v0.27.2]

  # --- POST /agents ---
  - id: create_agent
    method: POST
    path: /api/v1/agents
    auth: key
    versions: [v0.27.2]
    capture: {agent_id: "data.id"}
    json:
      title: "wd_rec_e6_agents_chatbot"
      description: "wd_rec_e6 agents linear Begin->Agent->Message"
      dsl: &dsl_linear
        components:
          begin:
            downstream: ["agent"]
            obj:
              component_name: Begin
              params: {}
            upstream: []
          agent:
            downstream: ["message"]
            obj:
              component_name: Agent
              params:
                delay_after_error: 1
                description: ""
                frequencyPenaltyEnabled: false
                frequency_penalty: 0.7
                llm_id: "{chat_model}"
                maxTokensEnabled: false
                max_retries: 3
                max_rounds: 5
                max_tokens: 256
                mcp: []
                message_history_window_size: 12
                outputs:
                  content: {type: string, value: ""}
                presencePenaltyEnabled: false
                presence_penalty: 0.4
                prompts:
                  - {content: "The user query is {sys.query}", role: user}
                sys_prompt: "You are a concise assistant. Answer in one short sentence."
                temperature: 0.1
                temperatureEnabled: true
                tools: []
                topPEnabled: false
                top_p: 0.3
            upstream: ["begin"]
          message:
            downstream: []
            obj:
              component_name: Message
              params:
                content: ["{agent@content}"]
            upstream: ["agent"]
        history: []
        retrieval: []
        path: []
        globals:
          sys.query: ""
          sys.user_id: ""
          sys.conversation_turns: 0
          sys.files: []
        variables: {}
  - id: create_agent_retrieval
    method: POST
    path: /api/v1/agents
    auth: key
    versions: [v0.27.2]
    capture: {agent_retrieval_id: "data.id"}
    json:
      title: "wd_rec_e6_agents_retrieval"
      description: "wd_rec_e6 agents with Retrieval tool"
      dsl: &dsl_retrieval
        components:
          begin:
            downstream: ["agent"]
            obj:
              component_name: Begin
              params: {}
            upstream: []
          agent:
            downstream: ["message"]
            obj:
              component_name: Agent
              params:
                delay_after_error: 1
                description: ""
                frequencyPenaltyEnabled: false
                frequency_penalty: 0.7
                llm_id: "{chat_model}"
                maxTokensEnabled: false
                max_retries: 3
                max_rounds: 5
                max_tokens: 256
                mcp: []
                message_history_window_size: 12
                outputs:
                  content: {type: string, value: ""}
                presencePenaltyEnabled: false
                presence_penalty: 0.4
                prompts:
                  - {content: "The user query is {sys.query}", role: user}
                sys_prompt: "You are a concise assistant. Answer in one short sentence."
                temperature: 0.1
                temperatureEnabled: true
                tools:
                  - component_name: Retrieval
                    name: Retrieval
                    id: "Retrieval:wdRecE6Agents"
                    params:
                      cross_languages: []
                      dataset_ids: ["{dataset_id}"]
                      description: "wd_rec_e6 agents dataset"
                      empty_response: ""
                      keywords_similarity_weight: 0.7
                      outputs:
                        formalized_content: {type: string, value: ""}
                      rerank_candidates_count: 64
                      rerank_id: ""
                      retrieval_from: dataset
                      similarity_threshold: 0.2
                      top_n: 8
                      use_kg: false
                topPEnabled: false
                top_p: 0.3
            upstream: ["begin"]
          message:
            downstream: []
            obj:
              component_name: Message
              params:
                content: ["{agent@content}"]
            upstream: ["agent"]
        history: []
        retrieval: []
        path: []
        globals:
          sys.query: ""
          sys.user_id: ""
          sys.conversation_turns: 0
          sys.files: []
        variables: {}
  # dsl {} jest poprawnym obiektem JSON -> upstream zaklada agenta z pustym grafem (code 0)
  - id: create_agent_empty_dsl
    method: POST
    path: /api/v1/agents
    json: {title: "wd_rec_e6_agents_empty", dsl: {}}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 0}
    capture: {agent_empty_id: "data.id"}
  - id: create_agent_duplicate
    method: POST
    path: /api/v1/agents
    json: {title: "wd_rec_e6_agents_chatbot", dsl: *dsl_linear}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 102}
  - id: create_agent_missing_dsl
    method: POST
    path: /api/v1/agents
    json: {title: "wd_rec_e6_agents_no_dsl"}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 101}
  - id: create_agent_missing_title
    method: POST
    path: /api/v1/agents
    json: {dsl: *dsl_linear}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 101}
  - id: create_agent_bad_dsl
    method: POST
    path: /api/v1/agents
    json: {title: "wd_rec_e6_agents_bad_dsl", dsl: "x"}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 101}
  - id: create_agent_no_auth
    method: POST
    path: /api/v1/agents
    json: {title: "wd_rec_e6_agents_no_auth", dsl: *dsl_linear}
    auth: none
    versions: [v0.27.2]
    expect: {status: 401, code: 401}

  # --- GET /agents (parametry czytane przez handler) ---
  - id: list_agents
    method: GET
    path: /api/v1/agents
    auth: key
    versions: [v0.27.2]
  - id: list_agents_page
    method: GET
    path: /api/v1/agents
    query: {page: 1, page_size: 10}
    auth: key
    versions: [v0.27.2]
  # keywords filtruje po tytule; porzadek po tytule rosnaco = deterministyczny
  - id: list_agents_keywords
    method: GET
    path: /api/v1/agents
    query: {keywords: "wd_rec_e6_agents", orderby: title, desc: false}
    auth: key
    versions: [v0.27.2]
  # parametr `title` nie jest czytany przez handler (zwraca pelna liste) — fakt z nagrania
  - id: list_agents_title_ignored
    method: GET
    path: /api/v1/agents
    query: {title: "wd_rec_e6_agents_chatbot"}
    auth: key
    versions: [v0.27.2]
  # parametr `id` tez nie jest czytany (tylko `keywords`/`owner_ids` filtruja) — analogiczny fakt
  - id: list_agents_id_ignored
    method: GET
    path: /api/v1/agents
    query: {id: "wd_rec_e6_agents_chatbot"}
    auth: key
    versions: [v0.27.2]
  - id: list_agents_orderby
    method: GET
    path: /api/v1/agents
    query: {orderby: title, desc: false}
    auth: key
    versions: [v0.27.2]
  - id: list_agents_category
    method: GET
    path: /api/v1/agents
    query: {canvas_category: agent_canvas}
    auth: key
    versions: [v0.27.2]
  # canvas_type i tags wylaczaja tryb "merge" z grupami szablonow (agent_api.py:749-751)
  - id: list_agents_canvas_type
    method: GET
    path: /api/v1/agents
    query: {canvas_type: Recommended}
    auth: key
    versions: [v0.27.2]
  - id: list_agents_tags
    method: GET
    path: /api/v1/agents
    query: {tags: "wd_rec_e6_agents"}
    auth: key
    versions: [v0.27.2]
  # type=filter zwraca slowniki owner/canvas_category (nie liste agentow)
  - id: list_agents_filter
    method: GET
    path: /api/v1/agents
    query: {type: filter}
    auth: key
    versions: [v0.27.2]
  - id: list_agents_owner_ids_foreign
    method: GET
    path: /api/v1/agents
    query: {owner_ids: "00000000000000000000000000000000"}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 103}

  # --- GET / PUT /agents/<id> ---
  - id: get_agent
    method: GET
    path: /api/v1/agents/{agent_id}
    auth: key
    versions: [v0.27.2]
  - id: get_agent_retrieval
    method: GET
    path: /api/v1/agents/{agent_retrieval_id}
    auth: key
    versions: [v0.27.2]
  - id: update_agent
    method: PUT
    path: /api/v1/agents/{agent_id}
    json: {title: "wd_rec_e6_agents_chatbot_v2", dsl: *dsl_linear}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 0}
  - id: get_agent_after_update
    method: GET
    path: /api/v1/agents/{agent_id}
    auth: key
    versions: [v0.27.2]
  - id: update_agent_duplicate_title
    method: PUT
    path: /api/v1/agents/{agent_id}
    json: {title: "wd_rec_e6_agents_retrieval"}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 102}
  - id: update_agent_bad_dsl
    method: PUT
    path: /api/v1/agents/{agent_id}
    json: {dsl: "x"}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 101}

  # --- sesje agenta ---
  - id: create_session
    method: POST
    path: /api/v1/agents/{agent_id}/sessions
    json: {name: "wd_rec_e6_agents_session"}
    auth: key
    versions: [v0.27.2]
    capture: {session_id: "data.id"}
  - id: list_sessions
    method: GET
    path: /api/v1/agents/{agent_id}/sessions
    auth: key
    versions: [v0.27.2]
  - id: list_sessions_page
    method: GET
    path: /api/v1/agents/{agent_id}/sessions
    query: {keywords: "wd_rec_e6_agents_session", page: 1, page_size: 10, orderby: update_time, desc: false}
    auth: key
    versions: [v0.27.2]
  - id: get_session
    method: GET
    path: /api/v1/agents/{agent_id}/sessions/{session_id}
    auth: key
    versions: [v0.27.2]

  # --- POST /agents/chat/completions ---
  # (a) nowa sesja (bez session_id) + SSE: pelna sekwencja ramek workflow_started/node_started/.../workflow_finished
  - id: completions_stream
    method: POST
    path: /api/v1/agents/chat/completions
    json: {agent_id: "{agent_id}", query: "smokwawelski", stream: true}
    auth: key
    versions: [v0.27.2]
    stream: true
  # (b) nowa sesja bez stream (JSON)
  - id: completions_json
    method: POST
    path: /api/v1/agents/chat/completions
    json: {agent_id: "{agent_id}", query: "smokwawelski", stream: false}
    auth: key
    versions: [v0.27.2]
  # (c) istniejaca sesja + SSE (sciezka sesyjna filtruje ramki: brak node_started/workflow_started)
  - id: completions_session_stream
    method: POST
    path: /api/v1/agents/chat/completions
    json: {agent_id: "{agent_id}", query: "smokwawelski", stream: true, session_id: "{session_id}"}
    auth: key
    versions: [v0.27.2]
    stream: true
  # (d) istniejaca sesja bez stream (JSON)
  - id: completions_session_json
    method: POST
    path: /api/v1/agents/chat/completions
    json: {agent_id: "{agent_id}", query: "smokwawelski", stream: false, session_id: "{session_id}"}
    auth: key
    versions: [v0.27.2]
  # (e) wariant z agentem z narzedziem Retrieval (fake-llm nie emituje tool_calls -> narzedzie nieuzyte)
  - id: completions_retrieval_stream
    method: POST
    path: /api/v1/agents/chat/completions
    json: {agent_id: "{agent_retrieval_id}", query: "smokwawelski", stream: true}
    auth: key
    versions: [v0.27.2]
    stream: true
  - id: completions_retrieval_json
    method: POST
    path: /api/v1/agents/chat/completions
    json: {agent_id: "{agent_retrieval_id}", query: "smokwawelski", stream: false}
    auth: key
    versions: [v0.27.2]

  # --- bledy: brak agent_id, nieistniejace id, cudza sesja, brak auth ---
  - id: completions_missing_agent_id
    method: POST
    path: /api/v1/agents/chat/completions
    json: {query: "smokwawelski", stream: false}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 101}
  - id: completions_missing_agent
    method: POST
    path: /api/v1/agents/chat/completions
    json: {agent_id: "00000000000000000000000000000000", query: "smokwawelski", stream: false}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 103}
  - id: completions_missing_session
    method: POST
    path: /api/v1/agents/chat/completions
    json: {agent_id: "{agent_id}", query: "smokwawelski", stream: false, session_id: "00000000000000000000000000000000"}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 102}
  - id: completions_session_other_agent
    method: POST
    path: /api/v1/agents/chat/completions
    json: {agent_id: "{agent_retrieval_id}", query: "smokwawelski", stream: false, session_id: "{session_id}"}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 103}
  - id: completions_no_auth
    method: POST
    path: /api/v1/agents/chat/completions
    json: {agent_id: "{agent_id}", query: "smokwawelski", stream: false}
    auth: none
    versions: [v0.27.2]
    expect: {status: 401, code: 401}
  - id: get_agent_missing
    method: GET
    path: /api/v1/agents/00000000000000000000000000000000
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 102}
  - id: get_agent_foreign
    method: GET
    path: /api/v1/agents/{agent_id}
    auth: second
    versions: [v0.27.2]
    expect: {status: 200, code: 102}
  - id: update_agent_foreign
    method: PUT
    path: /api/v1/agents/{agent_id}
    json: {title: "wd_rec_e6_agents_intruder"}
    auth: second
    versions: [v0.27.2]
    expect: {status: 200, code: 103}
  - id: update_agent_missing
    method: PUT
    path: /api/v1/agents/00000000000000000000000000000000
    json: {title: "wd_rec_e6_agents_missing"}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 103}
  - id: delete_agent_foreign
    method: DELETE
    path: /api/v1/agents/{agent_id}
    auth: second
    versions: [v0.27.2]
    expect: {status: 200, code: 103}
  - id: delete_agent_missing
    method: DELETE
    path: /api/v1/agents/00000000000000000000000000000000
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 103}
  - id: list_sessions_foreign
    method: GET
    path: /api/v1/agents/{agent_id}/sessions
    auth: second
    versions: [v0.27.2]
    expect: {status: 200, code: 103}
  - id: create_session_foreign
    method: POST
    path: /api/v1/agents/{agent_id}/sessions
    json: {name: "wd_rec_e6_agents_intruder"}
    auth: second
    versions: [v0.27.2]
    expect: {status: 200, code: 103}
  - id: get_session_foreign
    method: GET
    path: /api/v1/agents/{agent_id}/sessions/{session_id}
    auth: second
    versions: [v0.27.2]
    expect: {status: 200, code: 103}
  - id: get_session_missing
    method: GET
    path: /api/v1/agents/{agent_id}/sessions/00000000000000000000000000000000
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 102}
  - id: delete_session_foreign
    method: DELETE
    path: /api/v1/agents/{agent_id}/sessions/{session_id}
    auth: second
    versions: [v0.27.2]
    expect: {status: 200, code: 103}
  # sesje z nieistniejacym agent_id — wrapper dostepu zwraca OPERATING_ERROR (103)
  - id: list_sessions_missing_agent
    method: GET
    path: /api/v1/agents/00000000000000000000000000000000/sessions
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 103}
  - id: create_session_missing_agent
    method: POST
    path: /api/v1/agents/00000000000000000000000000000000/sessions
    json: {name: "wd_rec_e6_agents_missing"}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 103}
  - id: delete_sessions_missing_agent
    method: DELETE
    path: /api/v1/agents/00000000000000000000000000000000/sessions
    json: {ids: ["00000000000000000000000000000000"]}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 103}

  # --- DELETE sesji (pojedyncza i zbiorczo po ids) ---
  - id: delete_session
    method: DELETE
    path: /api/v1/agents/{agent_id}/sessions/{session_id}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 0}
  - id: get_session_after_delete
    method: GET
    path: /api/v1/agents/{agent_id}/sessions/{session_id}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 102}
  - id: create_session_2
    method: POST
    path: /api/v1/agents/{agent_id}/sessions
    json: {name: "wd_rec_e6_agents_session_2"}
    auth: key
    versions: [v0.27.2]
    capture: {session_id_2: "data.id"}
  - id: delete_sessions_by_ids
    method: DELETE
    path: /api/v1/agents/{agent_id}/sessions
    json: {ids: ["{session_id_2}"]}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 0}
  - id: get_session_2_after_delete
    method: GET
    path: /api/v1/agents/{agent_id}/sessions/{session_id_2}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 102}
  - id: delete_sessions_foreign
    method: DELETE
    path: /api/v1/agents/{agent_id}/sessions
    json: {ids: ["{session_id_2}"]}
    auth: second
    versions: [v0.27.2]
    expect: {status: 200, code: 103}

  # --- DELETE /agents/<id> i odczyt po usunieciu ---
  # przed usunieciem agenta usuwam hurtem sesje zalozone przez completions (nowa sesja)
  - id: clear_sessions_agent
    method: DELETE
    path: /api/v1/agents/{agent_id}/sessions
    json: {delete_all: true}
    auth: key
    versions: [v0.27.2]
    record: false
  - id: delete_agent
    method: DELETE
    path: /api/v1/agents/{agent_id}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 0}
  - id: get_agent_after_delete
    method: GET
    path: /api/v1/agents/{agent_id}
    auth: key
    versions: [v0.27.2]
    expect: {status: 200, code: 102}

  # --- sprzatanie (bez nagrania) ---
  # sesje zalozone przez completions (nowa sesja) usuwam hurtem, potem agentow i dataset
  - id: clear_sessions_retrieval
    method: DELETE
    path: /api/v1/agents/{agent_retrieval_id}/sessions
    json: {delete_all: true}
    auth: key
    versions: [v0.27.2]
    record: false
  - id: delete_agent_retrieval
    method: DELETE
