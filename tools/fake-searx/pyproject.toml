[project]
name = "fake-searx"
version = "0.0.0"
description = "fake-searx — deterministyczny stub SearXNG (JSON) do testów (E6-3f C6)"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fake_searx"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "BLE", "SIM", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["fake_searx"]
branch = true

[tool.coverage.report]
show_missing = true
