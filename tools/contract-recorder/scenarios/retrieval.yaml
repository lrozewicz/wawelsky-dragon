# Retrieval po sparsowaniu dokumentu; słowo-klucz z fixture: smokwawelski.
name: retrieval
description: "Wyszukiwanie fragmentów (POST /retrieval) w sparsowanym datasetu."
steps:
  - id: create_dataset
    method: POST
    path: /api/v1/datasets
    json: {name: "wd_rec_retrieval_ds"}
    record: false
    capture: {dataset_id: "data.id"}
  - id: upload
    method: POST
    path: /api/v1/datasets/{dataset_id}/documents
    multipart: {file: fixtures/ragflow_intro.txt}
    record: false
    capture: {document_id: "data.0.id"}
  - id: parse_v0_24
    method: POST
    path: /api/v1/datasets/{dataset_id}/chunks
    json: {document_ids: ["{document_id}"]}
    versions: [v0.24.0]
    record: false
  - id: parse_v0_27
    method: POST
    path: /api/v1/datasets/{dataset_id}/documents/parse
    json: {document_ids: ["{document_id}"]}
    versions: [v0.27.2]
    record: false
  - id: poll_parse_done
    method: GET
    path: /api/v1/datasets/{dataset_id}/documents
    query: {page: 1, page_size: 30}
    record: false
    poll:
      until: {path: "data.docs.0.run", equals: "DONE"}
      interval_s: 3
      timeout_s: 600
  - id: retrieve
    method: POST
    path: /api/v1/retrieval
    json:
      question: "smokwawelski"
      dataset_ids: ["{dataset_id}"]
      top_k: 5
    rules: {"data.chunks.0.similarity": type, "data.chunks.0.vector_similarity": type, "data.chunks.0.term_similarity": type}
  - id: delete_dataset
    method: DELETE
    path: /api/v1/datasets
    json: {ids: ["{dataset_id}"]}
    record: false
