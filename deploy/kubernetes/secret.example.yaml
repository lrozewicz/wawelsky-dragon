# Copy to secret.yaml, fill in, apply with `kubectl -n wawelsky-dragon apply -f secret.yaml`.
# Do not commit the filled-in file. For GitOps use Sealed Secrets, External Secrets or SOPS instead.
apiVersion: v1
kind: Secret
metadata:
  name: wawelsky-dragon-app
type: Opaque
stringData:
  # openssl rand -hex 24
  WD_DB_PASSWORD: ""
  MARIADB_ROOT_PASSWORD: ""
  # openssl rand -base64 48
  WD_SECRET_KEY: ""
  # openssl rand -hex 32 — encrypts data stored in the database; never change it on a running installation
  WD_CRYPTO_KEY: ""
  # openssl rand -hex 32
  WD_HUB_COMPAT_API_SECRET: ""
  # OpenAI-compatible gateway for chat and embeddings (LiteLLM, OpenRouter, vLLM, llama.cpp server...)
  WD_LLM_BASE_URL: ""
  WD_LLM_API_KEY: ""
  # Admin account, created once on first start
  WD_ADMIN_EMAIL: ""
  WD_ADMIN_PASSWORD: ""
