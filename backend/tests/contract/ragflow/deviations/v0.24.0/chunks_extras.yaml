# Odchyłki replay chunks_extras vs złoto v0.24.0 (CONTRACT C0 p. 3; K11 §5 p. 5).
# Dwie grupy:
#  * [es-refresh] — złoto utrwala nieświeży odczyt wyszukiwania ES po dodaniu chunku ręcznego:
#    upstream v0.24 `add_chunk` pisze przez `settings.docStoreConn.insert(...)`, a `rag/utils/es_conn.py`
#    `insert()` (v0.24.0, :193) woła `self.es.bulk(..., refresh=False, ...)` — dokument wchodzi do
#    segmentu dopiero po odświeżeniu indeksu (`conf/mapping.json` `"refresh_interval": "1000ms"`).
#    Lista chunków czyta przez `settings.retriever.search` (widzi wyłącznie odświeżone segmenty),
#    więc --07/--11/--13/--15 pokazują stan sprzed dodania chunku (1 chunk z parsowania), mimo że
#    --06 (POST code 0), --10 (PUT code 0) i --18 (DELETE code 0) potwierdzają zapisy. Chunek
#    z parsowania jest widoczny, bo krok `poll_parse_done` czeka 3 s na zakończenie parsowania.
#    DEC-034 (Doradca, 2026-09-29): WD zwraca stan po zapisie (read-your-writes) i nie odtwarza
#    nieświeżości; wpisy do zatwierdzenia TL. W v0.27.2 ten sam mechanizm dotyczy `update()`
#    bez refresh (deviations/chunks_extras.yaml), a `insert()` ma tam `refresh="wait_for"`.
#  * [chunker] — różnice chunkera WD (K5 §5) dla chunku z parsowania w --19 (jedyne miejsce,
#    gdzie porównywane są elementy listy): brak wiodącego "\n" i brak fabrykowanej pozycji.
#    Ten sam mechanizm co odchyłki chunks_list.yaml tego katalogu.

