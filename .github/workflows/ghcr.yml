# Public images on GitHub Container Registry, for installations that do not build from source
# (docs/en/getting-started.md, docs/en/kubernetes.md):
#   ghcr.io/lrozewicz/wawelsky-dragon/backend   api, worker and MCP server (different command)
#   ghcr.io/lrozewicz/wawelsky-dragon/web
#   ghcr.io/lrozewicz/wawelsky-dragon/searxng
#   ghcr.io/lrozewicz/wawelsky-dragon/mariadb   MariaDB with the project configuration (Docker Compose only)
# Tags for release v1.2.3: "1.2.3", "1.2" and "latest". Each image is built from the release tag.
#   tag v1.2.3            -> published automatically
#   "Run workflow"        -> publishes an existing release tag (input "tag"); "latest" moves only if asked
name: Publish images (GHCR)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.2.2
        required: true
        type: string
      latest:
        description: Also tag as "latest"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: image (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - {name: backend, context: backend, target: runtime}
          - {name: web, context: frontend, target: runtime}
          - {name: searxng, context: docker/searxng, target: runtime}
          - {name: mariadb, context: deploy/mariadb, target: ""}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      MOVE_LATEST: ${{ github.event_name == 'push' || inputs.latest }}
    steps:
      - name: Tags
        id: tags
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Expected a release tag like v1.2.3, got: $RELEASE_TAG"; exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image.name }}"
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          tags="$image:$version,$image:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          if [ "$MOVE_LATEST" = "true" ]; then tags="$tags,$image:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          target: ${{ matrix.image.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=ghcr-${{ matrix.image.name }}
          cache-to: type=gha,scope=ghcr-${{ matrix.image.name }},mode=max
