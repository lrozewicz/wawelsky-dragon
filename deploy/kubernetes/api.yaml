apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app.kubernetes.io/name: wawelsky-dragon, app.kubernetes.io/component: api}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wawelsky-dragon-api
spec:
  replicas: 1
  # The data volume is ReadWriteOnce and the init container runs schema migrations: one pod at a time.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: wawelsky-dragon, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: wawelsky-dragon, app.kubernetes.io/component: api}
    spec:
      securityContext: &pod-security
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Applies schema migrations, seeds the default models and creates the admin account (first start).
        # Fails until MariaDB accepts connections; Kubernetes retries it.
        - name: migrate
          image: wawelsky/backend
          command: [python, -m, app.tools.migrate]
          envFrom: &backend-env
            - configMapRef: {name: wawelsky-dragon-config}
            - secretRef: {name: wawelsky-dragon-app}
          volumeMounts: &backend-mounts
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
      containers:
        - name: api
          image: wawelsky/backend
          command:
            - uvicorn
            - app.main:create_app
            - --factory
            - --host=0.0.0.0
            - --port=8000
            - --workers=2
            - --proxy-headers
            - --forwarded-allow-ips=*
            - --timeout-keep-alive=75
          ports:
            - {name: http, containerPort: 8000}
          envFrom: *backend-env
          volumeMounts: *backend-mounts
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext: *container-security
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1536Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: wawelsky-dragon-data}
        - name: tmp
          emptyDir: {}
