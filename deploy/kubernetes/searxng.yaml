# Web search for the Agent. The api reaches it as http://searxng:8080; if it is down, search returns
# empty results and nothing else is blocked.
apiVersion: v1
kind: Service
metadata:
  name: searxng
spec:
  selector: {app.kubernetes.io/name: wawelsky-dragon, app.kubernetes.io/component: searxng}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wawelsky-dragon-searxng
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: wawelsky-dragon, app.kubernetes.io/component: searxng}
  template:
    metadata:
      labels: {app.kubernetes.io/name: wawelsky-dragon, app.kubernetes.io/component: searxng}
    spec:
      securityContext:
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: searxng
          image: wawelsky/searxng
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: SEARXNG_SECRET
              valueFrom: {secretKeyRef: {name: wawelsky-dragon-app, key: WD_SECRET_KEY}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: tmp, mountPath: /var/cache/searxng, subPath: var-cache-searxng}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 384Mi}
      volumes:
        - name: tmp
          emptyDir: {}
