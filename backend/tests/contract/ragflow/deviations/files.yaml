# Odchyłki replay scenariusza files vs złoto v0.27.2 (K11 §5 p. 5; wzór deviations/searches.yaml).
# Trzy klasy:
#   [wd-design] DEC-186 — WD nie tworzy folderu .knowledgebase ani plików-widoków datasetów
#     (K16 §1 p. 2: wiersze source_type='knowledgebase' są niewidoczne dla wszystkich operacji),
#     więc w listingach roota złoto ma o jeden element więcej, a numeracja tokenów <ID:id#n>
#     przesuwa się o wartości, które w złocie należą do .knowledgebase;
#   [wd-design] DEC-187 — kolumna files.location to klucz bloba (filemanager/…), nie nazwa, więc
#     po rename WD podaje bieżącą nazwę, a złoto zachowuje pierwotną;
#   [wd-design] E1-9a C2.4 — zamrożony prezenter dokumentów WD ma `thumbnail ← row.thumbnail or ""`,
#     a upstream zwraca dla dokumentu zlinkowanego z menedżera plików `null` (upload → "").
# Każdy wpis po polsku, z klasą w nawiasie i odwołaniem do decyzji/kontraktu.

