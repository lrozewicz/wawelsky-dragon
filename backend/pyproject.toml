[project]
name = "wawelsky-dragon-backend"
version = "1.3.0"
description = "Backend Wawelsky Dragon — lekki system RAG zgodny z API RAGFlow"
license = { text = "Apache-2.0" }
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.53.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncmy==0.2.15",
    "pymysql==1.2.3",
    "alembic==1.20.0",
    "httpx==0.28.1",
    "xxhash==4.0.1",
    "openai==3.19.2",
    "httpx2==2.13.1",
    "tiktoken==0.14.0",
    "cryptography==50.0.1",
    "pyjwt==2.15.0",
    "argon2-cffi==25.1.0",
    "pypdfium2==5.13.0",
    "pdfplumber==0.11.10",
    "mammoth==1.13.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "python-pptx==1.0.2",
    "markdown-it-py==4.2.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "charset-normalizer==3.5.1",
    "pytesseract==0.3.13",
    "pillow==12.3.0",
    "pystempel==1.2.0",
    "python-multipart==0.0.32",
    # Mapa modeli dla migracji RAGFlow→WD (E4-6a): czytana w runtime przez `plan`/`run`.
    "pyyaml==6.0.3",
    "wordfreq==3.1.1",
    # Serwer MCP (E6-2, K17 §2): ten sam zakres co upstream v0.27.2 (`mcp>=1.28.1,<2.0.0`);
    # przypięte do 1.30.0 — na tej wersji nagrano złoto `golden/v0.27.2/mcp/`.
    "mcp==1.30.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    # Zawieszony test nie blokuje wyroczni (E5-H10 T1): limit 300 s, metoda wg DEC-329.
    "pytest-timeout==2.4.0",
    "import-linter==2.15",
    # Port testów upstream RAGFlow (E2-3a1): `hypothesis` (dekoratory `@given`),
    # `requests-toolbelt` (`MultipartEncoder` uploadu dokumentów), `reportlab` (PDF-y w
    # `utils/file_utils.py`). Instalowane też w obrazach dev, ale nie w runtime.
    "hypothesis==6.168.3",
    "requests-toolbelt==1.0.0",
    "reportlab==5.0.1",
    # Port testów SDK (E2-3b): klient `ragflow_sdk` w wersji upstream v0.27.2.
    # Tylko do testów kontraktowych — nie trafia do obrazów runtime.
    "ragflow-sdk==0.27.2",
    "pip-audit==2.10.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "BLE", "SIM", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true

# Pakiety parsowania bez stubów/py.typed (pdfplumber, docx, pptx, pillow, bs4, markdown-it-py
# i charset-normalizer mają typy — zostają pod strict).
[[tool.mypy.overrides]]
module = ["lxml.*", "mammoth.*", "openpyxl.*", "pypdfium2.*", "pytesseract.*", "xlrd.*"]
ignore_missing_imports = true

# Migracja RAGFlow→WD (E4-6a): `pymysql` i `pyyaml` bez stubów/py.typed.
[[tool.mypy.overrides]]
module = ["pymysql", "pymysql.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Zawieszony test kończy się po 300 s czytelnym błędem `Timeout` zamiast wieszać wyrocznię
# na godziny (E5-H10 T1, uzasadnienie metody: docs/decisions/DEC-329.md).
timeout = 300
# `signal` (SIGALRM) zamiast domyślnego dla platformy wyboru: proces pytest zostaje przy życiu,
# więc krok `pytest-count` (junit.xml) i coverage.xml z verify-fast nadal powstają. Pod xdist
# każdy worker to osobny PROCES z własnym wątkiem głównym, więc SIGALRM działa; gdy test biegnie
# poza wątkiem głównym, plugin sam schodzi na `thread`.
timeout_method = "signal"
markers = [
    "db: testy z MariaDB",
    "contract: kontrakty API",
    "hub_compat: testy kontraktowe hub-compat (user-api, K7)",
    "live: prawdziwy LLM (tools/dev/live.sh)",
    "corpus: korpus testowy",
    "keycloak: testowy Keycloak",
    "e2e: end-to-end",
    "fakellm: wymaga fake-llm po sieci (WD_LLM_BASE_URL, verify.sh)",
    "binaries: wymaga tesseract/wvHtml/catppt (obraz test-ocr, krok binaries w verify-full.sh)",
    "sharepoint_live: prawdziwy tenant testowy (tools/dev/live.sh sharepoint-live)",
]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 80

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Warstwy"
type = "layers"
layers = ["api", "services", "domain"]
containers = ["app"]

[[tool.importlinter.contracts]]
id = "domain-pure"
name = "Domena bez I/O"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.db",
    "app.api",
    "app.llm",
    "app.storage",
    "app.parsing",
    "app.worker",
    "app.integrations",
    "sqlalchemy",
    "httpx",
    "openai",
    "fastapi",
    "app.text",
    "app.services",
]

[[tool.importlinter.contracts]]
id = "api-no-db"
name = "API nie dotyka bazy bezpośrednio"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.db", "sqlalchemy"]
ignore_imports = ["app.api.deps -> app.db.health"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "worker-no-api"
name = "Worker używa usług, nie API"
type = "forbidden"
source_modules = ["app.worker", "app.integrations"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
id = "ragflow-migrate-no-api"
name = "Narzędzie migracji nie zależy od API"
type = "forbidden"
source_modules = ["app.tools.ragflow_migrate"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
id = "compat-isolated"
name = "Kształty RAGFlow/hub-compat tylko w api"
type = "forbidden"
source_modules = ["app.services", "app.domain", "app.worker"]
forbidden_modules = ["app.api.ragflow", "app.api.hub_compat"]

[[tool.importlinter.contracts]]
id = "parsing-pure"
name = "Parsowanie bez DB/API/workera"
type = "forbidden"
source_modules = ["app.parsing"]
forbidden_modules = ["app.db", "app.api", "app.worker", "app.storage", "app.services", "app.core.container", "sqlalchemy", "fastapi"]

[[tool.importlinter.contracts]]
id = "text-pure"
name = "Tekst FULLTEXT bez DB/API/LLM/workera"
type = "forbidden"
source_modules = ["app.text"]
forbidden_modules = ["app.db", "app.api", "app.llm", "app.worker", "sqlalchemy", "fastapi"]
