# Completion natywny (SDK) i RESTful /chat/completions (tylko v0.27.2), stream i nie-stream.
name: completion
description: "Odpowiedzi asystenta: POST /chats/{id}/completions oraz /chat/completions."
steps:
  - id: create_dataset
    method: POST
    path: /api/v1/datasets
    json: {name: "wd_rec_completion_ds"}
    record: false
    capture: {dataset_id: "data.id"}
  - id: upload
    method: POST
    path: /api/v1/datasets/{dataset_id}/documents
    multipart: {file: fixtures/ragflow_intro.txt}
    record: false
    capture: {document_id: "data.0.id"}
  - id: parse_v0_24
    method: POST
    path: /api/v1/datasets/{dataset_id}/chunks
    json: {document_ids: ["{document_id}"]}
    versions: [v0.24.0]
    record: false
  - id: parse_v0_27
    method: POST
    path: /api/v1/datasets/{dataset_id}/documents/parse
    json: {document_ids: ["{document_id}"]}
    versions: [v0.27.2]
    record: false
  - id: poll_parse_done
    method: GET
    path: /api/v1/datasets/{dataset_id}/documents
    query: {page: 1, page_size: 30}
    record: false
    poll:
      until: {path: "data.docs.0.run", equals: "DONE"}
      interval_s: 3
      timeout_s: 600
  - id: create_chat
    method: POST
    path: /api/v1/chats
    json:
      name: "wd_rec_completion_chat"
      dataset_ids: ["{dataset_id}"]
    record: false
    capture: {chat_id: "data.id"}
  - id: create_session
    method: POST
    path: /api/v1/chats/{chat_id}/sessions
    json: {name: "wd_rec_completion_session"}
    record: false
    capture: {session_id: "data.id"}
  - id: sdk_completion_json
    method: POST
    path: /api/v1/chats/{chat_id}/completions
    json:
      question: "smokwawelski"
      stream: false
      session_id: "{session_id}"
    rules: {"data.reference.chunks.0.similarity": type, "data.reference.chunks.0.vector_similarity": type, "data.reference.chunks.0.term_similarity": type}
  - id: sdk_completion_sse
    method: POST
    path: /api/v1/chats/{chat_id}/completions
    json:
      question: "smokwawelski"
      stream: true
      session_id: "{session_id}"
    stream: true
  - id: rest_completion_json
    method: POST
    path: /api/v1/chat/completions
    versions: [v0.27.2]
    json:
      chat_id: "{chat_id}"
      session_id: "{session_id}"
      messages:
        - role: user
          content: "smokwawelski"
      stream: false
    rules: {"data.reference.chunks.0.similarity": type, "data.reference.chunks.0.vector_similarity": type, "data.reference.chunks.0.term_similarity": type}
  - id: rest_completion_sse
    method: POST
    path: /api/v1/chat/completions
    versions: [v0.27.2]
    json:
      chat_id: "{chat_id}"
      session_id: "{session_id}"
      messages:
        - role: user
          content: "smokwawelski"
      stream: true
    stream: true
  - id: delete_chat
    method: DELETE
    path: /api/v1/chats
    json: {ids: ["{chat_id}"]}
    record: false
  - id: delete_dataset
    method: DELETE
    path: /api/v1/datasets
    json: {ids: ["{dataset_id}"]}
    record: false
