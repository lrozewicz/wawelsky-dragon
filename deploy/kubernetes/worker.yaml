# Job queue: parsing, embedding, scheduled tasks. Parsing a large PDF needs memory: a 745-page
# document reached 2 GiB, so keep the limit at 3-4 GiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wawelsky-dragon-worker
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: wawelsky-dragon, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: wawelsky-dragon, app.kubernetes.io/component: worker}
    spec:
      # Same node as the api pod: both mount the ReadWriteOnce data volume.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/name: wawelsky-dragon, app.kubernetes.io/component: api}
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Starts after the api is ready, i.e. after the migrations.
        - name: wait-for-api
          image: wawelsky/backend
          command:
            - python
            - -c
            - |
              import time, urllib.request
              for _ in range(180):
                  try:
                      urllib.request.urlopen("http://api:8000/health/ready", timeout=3)
                      raise SystemExit(0)
                  except OSError:
                      time.sleep(5)
              raise SystemExit("api is not ready")
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
      containers:
        - name: worker
          image: wawelsky/backend
          command: [python, -m, app.worker.main]
          envFrom:
            - configMapRef: {name: wawelsky-dragon-config}
            - secretRef: {name: wawelsky-dragon-app}
          env:
            - {name: WD_WORKER_CONCURRENCY, value: "2"}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          livenessProbe:
            exec: {command: [python, -m, app.worker.healthcheck]}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
          securityContext: *container-security
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {memory: 4Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: wawelsky-dragon-data}
        - name: tmp
          emptyDir: {}
